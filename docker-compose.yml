# Arkitekt OpenCRM - Local Docker Compose Configuration
# =====================================================
# Starts PostgreSQL, applies Alembic migrations, then runs the pipeline and
# dashboard against the same consolidated SQLAlchemy data layer.
#
# Copy .env.example to .env and set POSTGRES_PASSWORD before starting.
# No credentials are stored in this file.
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f dashboard
#   docker compose down          # keeps the PostgreSQL volume
#   docker compose down -v       # DELETES the PostgreSQL volume

services:
  # ---------------------------------------------------------------------
  # Local PostgreSQL (development only; use managed PostgreSQL in prod)
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: opencrm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opencrm}
      POSTGRES_USER: ${POSTGRES_USER:-opencrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Exposed for local psql/psql-style tools. Remove for shared hosts.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opencrm} -d ${POSTGRES_DB:-opencrm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - lead-pipeline-network

  # ---------------------------------------------------------------------
  # One-shot migration job. Both application services wait for it.
  # ---------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: opencrm-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-opencrm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-opencrm}"
      SQLITE_MIGRATION_SOURCE: /app/data/leads.db
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Read-only legacy SQLite source for scripts/migrate_sqlite_to_postgres.py
      - ./data:/app/data:ro
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - lead-pipeline-network

  # ---------------------------------------------------------------------
  # Meta lead polling / email automation worker
  # ---------------------------------------------------------------------
  lead-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: opencrm-pipeline
    hostname: opencrm-pipeline
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-opencrm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-opencrm}"
      DB_SERVERLESS_MODE: "false"
      SQLITE_MIGRATION_SOURCE: /app/data/leads.db
      TZ: UTC
      LOG_DIR: /app/logs
      LOG_FILE_PATH: /app/logs/application/leads_automation.log
      HEALTH_CHECK_PORT: 8080
      HEALTH_CHECK_ENABLED: "true"
    ports:
      - "9010:8080"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:rw
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    stop_signal: SIGTERM
    networks:
      - lead-pipeline-network

  # ---------------------------------------------------------------------
  # Flask dashboard / API
  # ---------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: opencrm-dashboard
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-opencrm}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-opencrm}"
      DB_SERVERLESS_MODE: "false"
      SQLITE_MIGRATION_SOURCE: /app/data/leads.db
      DASHBOARD_PORT: 5050
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      SENDER_NAME: ${SENDER_NAME:-}
      TZ: UTC
    ports:
      - "5050:5050"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:rw
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["python", "dashboard.py"]
    networks:
      - lead-pipeline-network

networks:
  lead-pipeline-network:
    driver: bridge
    name: opencrm-network

volumes:
  postgres-data:
    name: opencrm-postgres-data
